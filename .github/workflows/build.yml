name: Build ForgeGradle 1.2

on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
      - name: Build original ForgeGradle plugin
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forgegradle-1.2-skycraft
          path: build/libs/*.jar
