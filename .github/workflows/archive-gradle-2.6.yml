name: Archive Gradle 2.6 distribution

on:
  push:
    paths:
      - '.github/workflows/archive-gradle-2.6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve the original Gradle 2.6 binary distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            --output gradle-2.6-bin.zip \
            https://downloads.gradle.org/distributions/gradle-2.6-bin.zip
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
            --output gradle-2.6-bin.zip.sha256 \
            https://downloads.gradle.org/distributions/gradle-2.6-bin.zip.sha256
          echo "$(cat gradle-2.6-bin.zip.sha256)  gradle-2.6-bin.zip" | sha256sum --check
          unzip -tq gradle-2.6-bin.zip
      - name: Preserve the verified Gradle distribution
        uses: actions/upload-artifact@v4
        with:
          name: gradle-2.6-bin-distribution
          path: |
            gradle-2.6-bin.zip
            gradle-2.6-bin.zip.sha256
          retention-days: 90
          if-no-files-found: error
