name: Restore upstream ForgeGradle 1.2 source

on:
  push:
    paths:
      - '.github/workflows/restore-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import official FG_1.2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch FG_1.2 https://github.com/MinecraftForge/ForgeGradle.git /tmp/forgegradle-upstream
          cp -a /tmp/forgegradle-upstream/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          # Preserve the restoration workflow on the destination branch.
          git show HEAD:.github/workflows/restore-upstream.yml > .github/workflows/restore-upstream.yml
          rm -rf /tmp/forgegradle-upstream
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/net/minecraftforge/gradle/common/Constants.java')
          s=p.read_text()
          replacements={
              'http://s3.amazonaws.com/Minecraft.Download/versions/{MC_VERSION}/{MC_VERSION}.json':
                'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json',
              'http://s3.amazonaws.com/Minecraft.Download/versions/{MC_VERSION}/{MC_VERSION}.jar':
                'https://piston-data.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar',
              'http://s3.amazonaws.com/Minecraft.Download/versions/{MC_VERSION}/minecraft_server.{MC_VERSION}.jar':
                'https://piston-data.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar',
              'http://resources.download.minecraft.net':
                'https://resources.download.minecraft.net'
          }
          for old,new in replacements.items():
              if old not in s: raise RuntimeError('Expected upstream constant missing: '+old)
              s=s.replace(old,new)
          p.write_text(s)
          # Maintain upstream build system; modern HTTPS Maven Central is reachable.
          b=Path('build.gradle')
          t=b.read_text().replace('https://repo1.maven.org/maven2','https://repo.maven.apache.org/maven2')
          b.write_text(t)
          # Preserve upstream license/attribution and document 1.7.10 scope.
          r=Path('README.md')
          r.write_text("# SkyCraft ForgeGradle 1.2 for Minecraft 1.7.10\\n\\nRestored from the official MinecraftForge/ForgeGradle FG_1.2 branch (LGPL-2.1).\\n\\nThe ForgeGradle API, MCP and reobfuscation logic are preserved. Legacy Minecraft download addresses are pinned to Mojang HTTPS for Minecraft 1.7.10. Other Minecraft versions are not supported by this initial patch.\\n\\nBuild and runtime validation are still required.\\n")
          PY
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore official ForgeGradle FG_1.2 sources and update Minecraft 1.7.10 downloads'
            git push origin HEAD:main
          fi
